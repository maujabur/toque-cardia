; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:waveshare_esp32_s3_zero]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = waveshare_esp32_s3_zero
framework = arduino

monitor_speed = 115200

; Biblioteca para controlar a fita WS2812 externa (varios LEDs por pino).
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

; A Waveshare ESP32-S3-Zero usa a porta USB-C nativa (USB Serial/JTAG).
; A board define ARDUINO_USB_MODE=1; e preciso habilitar o CDC no boot para
; que o objeto `Serial` do Arduino escreva nessa porta USB.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
